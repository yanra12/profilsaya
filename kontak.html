<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Hubungi Saya</title>

</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="profil.html">Profil</a>
            <a href="kontak.html">Kontak</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Hubungi Saya</h1>
        
        <div class="card-container">
            <p style="text-align: center; margin-bottom: 30px;">Silakan tinggalkan pesan melalui formulir di bawah ini.</p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="masukan nama kamu" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="pesan"> Pesan  </label>
                    <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan Anda di sini..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Tugas Web Development. Dibuat oleh [yanra].</p>
    </footer>

</body>
</html>
